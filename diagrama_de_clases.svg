<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="100%" height="100%">
  <style>
    .bg { fill: #f8fafc; }
    .class-header { fill: #1e293b; }
    .class-header-abstract { fill: #334155; }
    .header-text { fill: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: bold; text-anchor: middle; }
    .stereotype { fill: #cbd5e1; font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-style: italic; text-anchor: middle; }
    .class-body { fill: #ffffff; stroke: #334155; stroke-width: 2; }
    .divider { stroke: #cbd5e1; stroke-width: 1.5; }
    .member-text { fill: #0f172a; font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; }
    .relation-line { stroke: #475569; stroke-dasharray: 6 4; stroke-width: 2; }
    .solid-line { stroke: #1e293b; stroke-width: 2; }
    .relation-text { fill: #475569; font-family: sans-serif; font-size: 12px; font-weight: bold; }
  </style>

  <rect width="100%" height="100%" class="bg"/>

  <defs>
    <marker id="inheritance" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    </marker>
    <marker id="dependency" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#475569" stroke-width="1.5"/>
    </marker>
    <marker id="aggregation" viewBox="0 0 16 10" refX="0" refY="5" markerWidth="16" markerHeight="10" orient="auto">
      <path d="M 0 5 L 8 0 L 16 5 L 8 10 Z" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Personaje -->
  <g transform="translate(410, 40)">
    <rect x="0" y="0" width="280" height="220" rx="6" class="class-body"/>
    <rect x="0" y="0" width="280" height="45" rx="6" class="class-header-abstract"/>
    <rect x="0" y="30" width="280" height="15" class="class-header-abstract"/>
    <text x="140" y="18" class="stereotype">&lt;&lt;abstract&gt;&gt;</text>
    <text x="140" y="36" class="header-text">Personaje</text>
    <line x1="0" y1="45" x2="280" y2="45" class="divider"/>
    <text x="15" y="68" class="member-text"># idJugador: int</text>
    <text x="15" y="88" class="member-text"># nombre: String</text>
    <text x="15" y="108" class="member-text"># apodo: String</text>
    <text x="15" y="128" class="member-text"># anioCreacion: int</text>
    <line x1="0" y1="140" x2="280" y2="140" class="divider"/>
    <text x="15" y="163" class="member-text">+ calcularValorCombate()*: double</text>
    <text x="15" y="183" class="member-text">+ getNombre(): String</text>
    <text x="15" y="203" class="member-text">+ getApodo(): String</text>
  </g>

  <!-- Guerrero -->
  <g transform="translate(230, 400)">
    <rect x="0" y="0" width="290" height="190" rx="6" class="class-body"/>
    <rect x="0" y="0" width="290" height="40" rx="6" class="class-header"/>
    <rect x="0" y="25" width="290" height="15" class="class-header"/>
    <text x="145" y="26" class="header-text">Guerrero</text>
    <line x1="0" y1="40" x2="290" y2="40" class="divider"/>
    <text x="15" y="63" class="member-text">- poderAtaqueBase: double</text>
    <text x="15" y="83" class="member-text">- victoriasDuelo: int</text>
    <text x="15" y="103" class="member-text">- bonoVictoria: double</text>
    <line x1="0" y1="118" x2="290" y2="118" class="divider"/>
    <text x="15" y="143" class="member-text">+ Guerrero(...)</text>
    <text x="15" y="166" class="member-text">+ calcularValorCombate(): double</text>
  </g>

  <!-- Mago -->
  <g transform="translate(580, 400)">
    <rect x="0" y="0" width="280" height="190" rx="6" class="class-body"/>
    <rect x="0" y="0" width="280" height="40" rx="6" class="class-header"/>
    <rect x="0" y="25" width="280" height="15" class="class-header"/>
    <text x="140" y="26" class="header-text">Mago</text>
    <line x1="0" y1="40" x2="280" y2="40" class="divider"/>
    <text x="15" y="63" class="member-text">- reservaManaBase: double</text>
    <line x1="0" y1="85" x2="280" y2="85" class="divider"/>
    <text x="15" y="110" class="member-text">+ Mago(...)</text>
    <text x="15" y="133" class="member-text">+ calcularValorCombate(): double</text>
    <text x="15" y="156" class="member-text">- calcularAntiguedad(): int</text>
  </g>

  <!-- Gremio -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="290" height="190" rx="6" class="class-body"/>
    <rect x="0" y="0" width="290" height="40" rx="6" class="class-header"/>
    <rect x="0" y="25" width="290" height="15" class="class-header"/>
    <text x="145" y="26" class="header-text">Gremio</text>
    <line x1="0" y1="40" x2="290" y2="40" class="divider"/>
    <text x="15" y="63" class="member-text">- nombre: String</text>
    <text x="15" y="83" class="member-text">- personajes: List&lt;Personaje&gt;</text>
    <line x1="0" y1="100" x2="290" y2="100" class="divider"/>
    <text x="15" y="125" class="member-text">+ Gremio(nombre: String)</text>
    <text x="15" y="145" class="member-text">+ agregarPersonaje(p: Personaje)</text>
    <text x="15" y="165" class="member-text">+ mostrarValorCombate(): void</text>
  </g>

  <!-- PersonajeFactory -->
  <g transform="translate(760, 40)">
    <rect x="0" y="0" width="300" height="180" rx="6" class="class-body"/>
    <rect x="0" y="0" width="300" height="40" rx="6" class="class-header"/>
    <rect x="0" y="25" width="300" height="15" class="class-header"/>
    <text x="150" y="26" class="header-text">PersonajeFactory</text>
    <line x1="0" y1="40" x2="300" y2="40" class="divider"/>
    <text x="15" y="63" class="member-text" fill="#94a3b8"><i>(sin atributos)</i></text>
    <line x1="0" y1="80" x2="300" y2="80" class="divider"/>
    <text x="15" y="105" class="member-text">+ crearGuerrero(...): Personaje</text>
    <text x="15" y="130" class="member-text">+ crearMago(...): Personaje</text>
  </g>

  <!-- RELACIONES -->
  <!-- Herencia Guerrero -> Personaje -->
  <path d="M 375 400 L 375 310 L 550 310 L 550 260" fill="none" class="solid-line" marker-end="url(#inheritance)"/>
  
  <!-- Herencia Mago -> Personaje -->
  <path d="M 720 400 L 720 310 L 550 310" fill="none" class="solid-line"/>

  <!-- Agregacion Gremio -> Personaje -->
  <path d="M 330 130 L 410 130" fill="none" class="solid-line" marker-start="url(#aggregation)"/>
  <text x="340" y="120" class="relation-text">1</text>
  <text x="395" y="120" class="relation-text">*</text>

  <!-- Dependencia Factory -> Personaje -->
  <path d="M 760 130 L 690 130" fill="none" class="relation-line" marker-end="url(#dependency)"/>
  <text x="695" y="120" class="relation-text">instancia</text>

  <!-- Dependencia Gremio -> Factory -->
  <path d="M 185 230 C 185 320, 910 320, 910 220" fill="none" class="relation-line" marker-end="url(#dependency)"/>
  <text x="520" y="310" class="relation-text">usa factory</text>

</svg>